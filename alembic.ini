# Alembic configuration. The database URL is injected at runtime from
# security.config.Settings (see database/migrations/env.py) -- do NOT put a real
# URL here.

[alembic]
script_location = database/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is set programmatically in env.py

# Format new revision scripts manually with `ruff format database/migrations`.
[post_write_hooks]
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
