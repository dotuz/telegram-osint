[project]
name = "telegram-osint"
version = "0.1.0"
description = "Telegram OSINT Intelligence Platform - public-data intelligence, correlation, and reporting."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "structlog>=24.4",
    "python-telegram-bot>=21.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "email-validator>=2.2",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "anyio>=4.6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Namespace-style: each top-level dir is its own package tree.
packages = [
    "apps", "apps.api", "apps.api.routers", "apps.bot", "apps.bot.handlers", "apps.dashboard",
    "workers",
    "collectors", "collectors.common", "collectors.telegram", "collectors.username",
    "collectors.github", "collectors.reddit", "collectors.web",
    "intelligence", "intelligence.entity_resolution", "intelligence.relationships",
    "intelligence.timeline", "intelligence.confidence", "intelligence.ioc",
    "intelligence.classification",
    "reports", "reports.renderers",
    "database", "database.models", "database.repositories",
    "security",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests",
    "integration: needs database/redis",
    "security: security regression tests (IDOR, CSRF, CORS, SSRF, ...)",
    "e2e: end-to-end bot/API flows",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert allowed in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
